<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lee / Almacena Código de Barra (Piloto)</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/lector-codigo-barra.css">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

<div class="app-lcb">

    <header class="topbar-sp">
        <div class="topbar-sp-row">
            <button class="icon-btn" onclick="goMenu()" aria-label="Volver al menú">←</button>
            <h1>Lee / Almacena Código de Barra (Piloto)</h1>
        </div>
    </header>

    <div class="contenido-scroll lcb-contenido">

        <p class="lcb-aviso">
            Piloto experimental: mide el tiempo entre la lectura de un código y su guardado en Google Sheets.
            No busca productos ni afecta ventas.
        </p>

        <button id="btnIniciarLcb" class="btn-nuevo-ticket" type="button">Abrir cámara</button>

        <div id="reader" class="lcb-reader"></div>

        <h3 id="resultadoLcb">Esperando lectura...</h3>

        <div class="lcb-historial">
            <h4>Historial de lecturas</h4>
            <div id="listaHistorialLcb"></div>
        </div>

    </div>

</div>

<div id="toast" class="toast"></div>

<script>
const token = sessionStorage.getItem("access_token");
if (!token) window.location.href = "login.html";

function goMenu() {
    window.location.href = "index.html";
}
</script>

<script src="js/api.js"></script>
<script src="js/lector-codigo-barra.js"></script>

</body>
</html>
