<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>KIVOR — Menú Cubo (prototipo)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/cubo.css">
</head>
<body data-theme="dark" class="app-cubo">

<header class="cubo-topbar">
    <button type="button" class="cubo-volver" id="botonVolver" hidden>← Volver</button>
    <span class="cubo-topbar-title">KIVOR</span>
</header>

<main class="cubo-escenario" id="cuboEscenario">
    <div class="cubo-stage" id="cuboStage">
        <div class="cubo-sombra" id="cuboSombra"></div>
        <div class="cubo" id="cubo">
            <!-- Las 4 caras laterales se llenan por JS
                 (aplicarContenidoNivel), empezando por MENU_RAIZ -el
                 contenido cambia según el nivel en que esté el cubo,
                 así que acá no hace falta texto de partida. -->
            <div class="cara cara-frente"><span class="cara-label"></span></div>
            <div class="cara cara-derecha"><span class="cara-label"></span></div>
            <div class="cara cara-atras"><span class="cara-label"></span></div>
            <div class="cara cara-izquierda"><span class="cara-label"></span></div>
            <div class="cara cara-arriba">
                <span class="cara-label cara-label-logo">KIVOR</span>
            </div>
            <div class="cara cara-abajo">
                <span class="cara-label cara-label-logo">KIVOR</span>
            </div>
        </div>
    </div>
</main>

<div id="toastCubo" class="cubo-toast"></div>
<div id="debugInfo" class="cubo-debug"></div>

<script src="js/cubo.js"></script>
</body>
</html>
