<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tickets</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/ticket.css">
<link rel="stylesheet" href="css/customer-selector.css">
</head>
<body>

<div class="app-ticket">

    <header class="topbar-ticket">
        <div class="topbar-ticket-row">
            <button class="icon-btn" onclick="goMenu()" aria-label="Volver al menú">←</button>
            <div class="topbar-ticket-titulo">
                <h1>Tickets</h1>
                <div id="fechaCabecera" class="fecha-cabecera"></div>
            </div>
            <button id="btnRefrescar" class="icon-btn" title="Actualizar" aria-label="Actualizar">⟳</button>
        </div>
    </header>

    <div class="barra-nuevo">
        <button id="btnNuevoTicket" class="btn-nuevo-ticket">+ Nuevo Ticket</button>
    </div>

    <div id="filtros" class="filtros">
        <div class="filtro-campo">
            <label for="fechaDesde">Desde</label>
            <input type="date" id="fechaDesde">
        </div>
        <div class="filtro-campo filtro-hasta">
            <label for="fechaHasta">Hasta</label>
            <div class="campo-hasta-row">
                <input type="date" id="fechaHasta">
                <button id="btnCampoFecha" class="btn-campo-fecha-icono" type="button" data-campo="created" title="Cambiar a qué fecha aplica el filtro">
                    📅 Creado
                </button>
            </div>
        </div>
        <div class="filtro-campo filtro-status">
            <label for="filtroStatus">
                Status
                <button id="btnLimpiarStatus" class="btn-limpiar-status" type="button" title="Mostrar todos los status">Limpiar</button>
            </label>
            <select id="filtroStatus" multiple></select>
        </div>
        <button id="btnOrden" class="btn-orden" data-orden="desc">Más reciente primero ↓</button>
        <button id="btnAplicarFiltros" class="btn-aplicar-filtros">Aplicar</button>
    </div>

    <div class="contenido-scroll">
        <div id="listaVacia" class="lista-vacia hidden">No hay tickets para los filtros seleccionados.</div>
        <div id="listaTickets" class="lista-tickets"></div>
    </div>

</div>

<div id="bookingModal" class="cs-modal">
    <div id="bookingBackdrop" class="cs-backdrop"></div>
    <div class="cs-sheet">
        <div class="cs-sheet-handle"></div>
        <header class="cs-sheet-header">
            <strong class="booking-sheet-titulo">Fecha agendamiento</strong>
            <button id="bookingClose" class="cs-close" aria-label="Cerrar">✕</button>
        </header>
        <div class="booking-sheet-body">
            <div class="filtro-campo">
                <label for="bookingFecha">Fecha</label>
                <input type="date" id="bookingFecha">
            </div>
            <div class="filtro-campo">
                <label for="bookingHora">Hora</label>
                <input type="time" id="bookingHora">
            </div>
        </div>
        <div class="booking-sheet-acciones">
            <button id="bookingGuardar" class="btn-nuevo-ticket" type="button">Guardar</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
const token = sessionStorage.getItem("access_token");
if (!token) window.location.href = "login.html";

function goMenu() {
    window.location.href = "index.html";
}
</script>

<script src="js/api.js"></script>
<script src="js/customer-selector.js"></script>
<script src="js/ticket.js"></script>

</body>
</html>
