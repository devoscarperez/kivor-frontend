<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cierre de Tickets</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/ticket.css">
<link rel="stylesheet" href="css/cierre-tickets.css">
</head>
<body>

<div class="app-ct">

    <header class="topbar-ct">
        <div class="topbar-ct-row">
            <button class="icon-btn" onclick="goMenu()" aria-label="Volver al menú">←</button>
            <h1>Cierre de Tickets</h1>
            <button id="btnRefrescarCt" class="icon-btn" title="Actualizar" aria-label="Actualizar">⟳</button>
        </div>
    </header>

    <div class="contenido-scroll">
        <div id="listaCtVacia" class="lista-vacia hidden">No hay tickets para hoy.</div>
        <div id="listaCierreTickets" class="lista-cierre-tickets"></div>
    </div>

</div>

<div id="toast" class="toast"></div>

<script>
const token = sessionStorage.getItem("access_token");
if (!token) window.location.href = "login.html";

function goMenu() {
    window.location.href = "index.html";
}
</script>

<script src="js/api.js"></script>
<script src="js/cierre-tickets.js"></script>

</body>
</html>
