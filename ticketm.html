<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ticket Mágico</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/ticketm.css">
</head>
<body>

<div class="app-ticketm">

    <header class="ticketm-topbar">
        <button class="ticketm-icon-btn" onclick="goMenu()" aria-label="Volver al menú">←</button>
        <button class="ticketm-fecha-toggle" id="btnFiltros" aria-expanded="false" aria-controls="panelFiltros">
            <span id="ticketmFecha"></span>
            <span class="ticketm-chevron" aria-hidden="true">⌄</span>
        </button>
        <button class="ticketm-icon-btn" id="btnRefrescarM" title="Actualizar" aria-label="Actualizar">⟳</button>
    </header>

    <div class="ticketm-filtros" id="panelFiltros" hidden>
        <div class="ticketm-filtros-fechas">
            <input type="date" id="fFechaDesde" aria-label="Desde">
            <span>a</span>
            <input type="date" id="fFechaHasta" aria-label="Hasta">
        </div>
        <div class="ticketm-filtros-status" id="fStatusChips"></div>
        <button class="ticketm-filtros-aplicar" id="btnAplicarFiltrosM">Aplicar</button>
    </div>

    <main class="ticketm-stage">
        <div class="ticketm-row">
            <div class="ticketm-slot" id="ticketmSlot">
                <div class="ticketm-vacio" id="ticketmVacio">No hay tickets agendados para hoy.</div>
            </div>
        </div>
    </main>

</div>

<div id="toastM" class="toast"></div>

<script>
const token = sessionStorage.getItem("access_token");
if (!token) window.location.href = "login.html";

function goMenu() {
    window.location.href = "dashboard.html";
}
</script>

<script src="js/api.js"></script>
<script src="js/ticketm.js"></script>

</body>
</html>
