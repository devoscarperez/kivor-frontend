<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Profesionales del Ticket</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/ticket.css">
<link rel="stylesheet" href="css/ticket-profesionales.css">
<link rel="stylesheet" href="css/customer-selector.css">
</head>
<body>

<div class="app-tp">

    <header class="topbar-tp">
        <div class="topbar-tp-row">
            <button class="icon-btn" onclick="volverATickets()" aria-label="Volver a Tickets">←</button>
            <h1>Profesionales del Ticket</h1>
            <button class="icon-btn" onclick="abrirAgendaClienta()" title="Agenda de clienta" aria-label="Agenda de clienta">📅</button>
            <button id="btnRefrescarTp" class="icon-btn" title="Actualizar" aria-label="Actualizar">⟳</button>
        </div>
        <div id="cabeceraTicket" class="cabecera-ticket"></div>
    </header>

    <div class="barra-nuevo-tp">
        <button id="btnAgregarProfesional" class="btn-nuevo-ticket">+ Agregar profesional</button>
    </div>

    <div class="contenido-scroll">
        <div id="sinProfesionales" class="lista-vacia hidden">Esta ticket aún no tiene profesionales asignadas.</div>
        <div id="listaProfesionales" class="lista-profesionales"></div>
    </div>

</div>

<div id="tpcBookingModal" class="cs-modal">
    <div id="tpcBookingBackdrop" class="cs-backdrop"></div>
    <div class="cs-sheet">
        <div class="cs-sheet-handle"></div>
        <header class="cs-sheet-header">
            <strong class="booking-sheet-titulo">Fecha agendamiento clienta</strong>
            <button id="tpcBookingClose" class="cs-close" aria-label="Cerrar">✕</button>
        </header>
        <div class="booking-sheet-body">
            <div class="filtro-campo">
                <label for="tpcBookingFecha">Fecha</label>
                <input type="date" id="tpcBookingFecha">
            </div>
            <div class="filtro-campo">
                <label for="tpcBookingHora">Hora</label>
                <input type="time" id="tpcBookingHora">
            </div>
        </div>
        <div class="booking-sheet-acciones">
            <button id="tpcBookingGuardar" class="btn-nuevo-ticket" type="button">Guardar</button>
        </div>
    </div>
</div>

<div id="agendaModal" class="cs-modal">
    <div id="agendaBackdrop" class="cs-backdrop"></div>
    <div class="cs-sheet">
        <div class="cs-sheet-handle"></div>
        <header class="cs-sheet-header">
            <strong class="booking-sheet-titulo">Agenda de clienta</strong>
            <button id="agendaClose" class="cs-close" aria-label="Cerrar">✕</button>
        </header>
        <div class="agenda-popup-filtros">
            <div id="agendaClientaContenedor"></div>
            <input type="date" id="agendaFecha">
        </div>
        <div class="agenda-popup-contenido">
            <div id="agendaVacia" class="lista-vacia">Selecciona una clienta y una fecha para ver sus atenciones.</div>
            <table id="tablaAgenda" class="tabla-agenda hidden">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Profesional</th>
                        <th>Hora</th>
                        <th>Ticket</th>
                    </tr>
                </thead>
                <tbody id="filasAgenda"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
const token = sessionStorage.getItem("access_token");
if (!token) window.location.href = "login.html";

function volverATickets() {
    window.location.href = "ticket.html";
}
</script>

<script src="js/api.js"></script>
<script src="js/customer-selector.js"></script>
<script src="js/ticket-profesionales.js"></script>

</body>
</html>
