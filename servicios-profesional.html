<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mis Servicios de Hoy</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/ticket.css">
<link rel="stylesheet" href="css/servicios-profesional.css">
<link rel="stylesheet" href="css/customer-selector.css">
</head>
<body>

<div class="app-sp">

    <header class="topbar-sp">
        <div class="topbar-sp-row">
            <button class="icon-btn" onclick="goMenu()" aria-label="Volver al menú">←</button>
            <h1>Mis Servicios de Hoy</h1>
            <button id="btnRefrescarSp" class="icon-btn" title="Actualizar" aria-label="Actualizar">⟳</button>
        </div>
    </header>

    <div class="contenido-scroll">
        <div id="agendaSpVacia" class="lista-vacia hidden">No tienes atenciones agendadas para hoy.</div>
        <div id="listaAgendaSp" class="lista-agenda-sp"></div>
    </div>

</div>

<div id="servicioModal" class="cs-modal">
    <div id="servicioBackdrop" class="cs-backdrop"></div>
    <div class="cs-sheet">
        <div class="cs-sheet-handle"></div>
        <header class="cs-sheet-header">
            <strong class="booking-sheet-titulo">Asignar servicio</strong>
            <button id="servicioClose" class="cs-close" aria-label="Cerrar">✕</button>
        </header>
        <div class="servicio-sheet-body">
            <div class="filtro-campo">
                <label for="servicioFamilia">Familia</label>
                <select id="servicioFamilia"><option value="">Selecciona...</option></select>
            </div>
            <div class="filtro-campo">
                <label for="servicioNivel2">Nivel 2</label>
                <select id="servicioNivel2" disabled><option value="">Selecciona...</option></select>
            </div>
            <div class="filtro-campo">
                <label for="servicioNivel3">Nivel 3</label>
                <select id="servicioNivel3" disabled><option value="">Selecciona...</option></select>
            </div>
            <div class="filtro-campo">
                <label for="servicioNivel4">Nivel 4</label>
                <select id="servicioNivel4" disabled><option value="">Selecciona...</option></select>
            </div>
        </div>
        <div class="servicio-sheet-acciones">
            <button id="servicioAgregar" class="btn-nuevo-ticket" type="button" disabled>Agregar</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
const token = sessionStorage.getItem("access_token");
if (!token) window.location.href = "login.html";

function goMenu() {
    window.location.href = "index.html";
}
</script>

<script src="js/api.js"></script>
<script src="js/servicios-profesional.js"></script>

</body>
</html>
